<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Chat - AI Search</title>
  <style>
    :root {
      --bg: #0f1419;
      --card-bg: #1a1f2e;
      --border: #2d3748;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --user-msg: #3b82f6;
      --ai-msg: #8b5cf6;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--card-bg);
      border-bottom: 2px solid var(--border);
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .message.user .avatar {
      background: var(--user-msg);
    }

    .message.ai .avatar {
      background: var(--ai-msg);
    }

    .message-content {
      max-width: 70%;
      padding: 16px 20px;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--border);
    }

    .message.user .message-content {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--user-msg);
    }

    .message.ai .message-content {
      background: rgba(139, 92, 246, 0.15);
      border-color: var(--ai-msg);
    }

    .recipe-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .recipe-card:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .recipe-images {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }

    .recipe-country-flag {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }

    .recipe-main-image {
      width: 120px;
      height: 120px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .recipe-details {
      flex: 1;
      min-width: 0;
    }

    .recipe-name {
      font-weight: 600;
      color: var(--accent);
      font-size: 16px;
      margin-bottom: 8px;
    }

    .recipe-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .recipe-similarity {
      background: rgba(245, 158, 11, 0.2);
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 600;
      color: var(--accent);
    }

    .recipe-preview {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin-top: 8px;
    }

    .recipe-ingredients {
      margin-top: 12px;
      padding: 12px;
      background: rgba(245, 158, 11, 0.05);
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }

    .recipe-ingredients-title {
      font-weight: 600;
      color: var(--accent);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .recipe-ingredients-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--text);
    }

    .ingredient-item {
      background: var(--card-bg);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .recipe-description {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      max-height: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .view-details-btn {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-details-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      overflow-y: auto;
      padding: 20px;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: var(--radius);
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 28px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .modal-close:hover {
      background: var(--bg);
      color: var(--text);
    }

    .modal-recipe-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
      padding-right: 50px;
    }

    .modal-section {
      margin: 20px 0;
    }

    .modal-section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .modal-ingredients-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 8px;
    }

    .modal-ingredient {
      background: var(--bg);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
    }

    .modal-instructions {
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
    }

    .input-container {
      background: var(--card-bg);
      border-top: 2px solid var(--border);
      padding: 20px;
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      max-width: 1000px;
      margin: 0 auto;
    }

    textarea {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      transition: all 0.2s ease;
      min-height: 50px;
      max-height: 150px;
      resize: vertical;
      font-family: inherit;
      line-height: 1.5;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }

    button {
      padding: 14px 28px;
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      background: var(--accent);
      color: white;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing-indicator {
      display: none;
      gap: 4px;
      padding: 12px;
    }

    .typing-indicator.show {
      display: flex;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }

    .suggestion-chip {
      padding: 8px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .suggestion-chip:hover {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.1);
    }

    @media (max-width: 768px) {
      .message-content {
        max-width: 85%;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🍳 Recipe Chat - AI Search</h1>
    <p class="subtitle">Semantic search powered by vector embeddings</p>
  </header>

  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="empty-state">
        <div class="empty-state-icon">🍽️</div>
        <p>Ask me about recipes or browse by category!</p>
        <div class="suggestions" id="category-suggestions">
          <!-- Categories will be loaded dynamically -->
        </div>
      </div>
    </div>
  </div>

  <div class="input-container">
    <div class="input-wrapper">
      <textarea 
        id="query" 
        placeholder="What kind of recipe are you looking for? (Shift+Enter for new line)"
        rows="1"
      ></textarea>
      <button onclick="searchRecipes()" id="send-btn">Search</button>
    </div>
  </div>

  <!-- Modal for recipe details -->
  <div class="modal" id="recipe-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeRecipeModal()">&times;</button>
      <div id="modal-recipe-content">
        <!-- Recipe details will be loaded here -->
      </div>
    </div>
  </div>

  <script>
    const messagesContainer = document.getElementById('messages');
    const queryInput = document.getElementById('query');
    const sendBtn = document.getElementById('send-btn');

    // Load categories on page load
    async function loadCategories() {
      try {
        console.log('Loading categories...');
        // Add cache busting
        const response = await fetch('/api/categories/distinct?t=' + Date.now());
        console.log('Categories response status:', response.status);
        
        if (!response.ok) {
          console.error('Categories request failed:', response.status);
          return;
        }
        
        const categories = await response.json();
        console.log('Categories loaded:', categories.length, categories);
        
        const container = document.getElementById('category-suggestions');
        container.innerHTML = '';
        
        categories.forEach(cat => {
          const chip = document.createElement('div');
          chip.className = 'suggestion-chip';
          chip.textContent = cat.name;
          chip.onclick = () => loadRecipesByCategory(cat.name);
          container.appendChild(chip);
        });
        
        console.log('Categories rendered successfully');
      } catch (error) {
        console.error('Failed to load categories:', error);
      }
    }

    // Handle shift+enter for multiline, enter for send
    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        searchRecipes();
      }
    });

    // Auto-resize textarea
    queryInput.addEventListener('input', () => {
      queryInput.style.height = 'auto';
      queryInput.style.height = queryInput.scrollHeight + 'px';
    });

    function clearEmptyState() {
      const emptyState = messagesContainer.querySelector('.empty-state');
      if (emptyState) {
        emptyState.remove();
      }
    }

    function addMessage(text, type) {
      clearEmptyState();
      const message = document.createElement('div');
      message.className = `message ${type}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = type === 'user' ? '👤' : '🤖';
      
      const content = document.createElement('div');
      content.className = 'message-content';
      content.innerHTML = text;
      
      message.appendChild(avatar);
      message.appendChild(content);
      messagesContainer.appendChild(message);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function showTyping() {
      clearEmptyState();
      const typing = document.createElement('div');
      typing.className = 'message ai';
      typing.id = 'typing-indicator';
      
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '🤖';
      
      const content = document.createElement('div');
      content.className = 'message-content';
      content.innerHTML = '<div class="typing-indicator show"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
      
      typing.appendChild(avatar);
      typing.appendChild(content);
      messagesContainer.appendChild(typing);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function hideTyping() {
      const typing = document.getElementById('typing-indicator');
      if (typing) typing.remove();
    }

    function formatRecipe(recipe) {
      // Debug log - show ALL recipe fields
      console.log('=== Recipe Object ===');
      console.log('Full recipe:', recipe);
      console.log('country_flag:', recipe.country_flag);
      console.log('country:', recipe.country);
      console.log('ingredients:', recipe.ingredients);
      
      const countryFlag = recipe.country_flag || '';
      const recipeImg = recipe.image_recipe || recipe.thumbnail_url || '';
      const ingredients = recipe.ingredients || [];
      const instructions = recipe.instructions || '';
      
      let html = '<div class="recipe-card">';
      
      // Images section
      html += '<div class="recipe-images">';
      if (countryFlag) {
        html += `<img src="${countryFlag}" alt="${recipe.country || recipe.area || ''}" class="recipe-country-flag" onerror="this.style.display='none'">`;
      }
      if (recipeImg) {
        html += `<img src="${recipeImg}" alt="${recipe.name_meal || recipe.name}" class="recipe-main-image" onerror="this.style.display='none'">`;
      }
      html += '</div>';
      
      // Details section
      html += '<div class="recipe-details">';
      html += `<div class="recipe-name">${recipe.name_meal || recipe.name}</div>`;
      
      html += '<div class="recipe-meta">';
      if (recipe.category || recipe.category_name) {
        html += `<span>🍽️ ${recipe.category || recipe.category_name}</span>`;
      }
      if (recipe.country || recipe.area) {
        html += `<span>🌍 ${recipe.country || recipe.area}</span>`;
      }
      if (recipe.similarity) {
        html += `<span class="recipe-similarity">${(recipe.similarity * 100).toFixed(0)}% match</span>`;
      }
      html += '</div>';
      
      // Ingredients
      if (ingredients.length > 0) {
        html += '<div class="recipe-ingredients">';
        html += '<div class="recipe-ingredients-title">🧂 Ingredients:</div>';
        html += '<div class="recipe-ingredients-list">';
        
        let count = 0;
        ingredients.slice(0, 8).forEach((ing, index) => {
          // Handle different formats
          let ingredient = '';
          let measure = '';
          
          if (typeof ing === 'object' && ing !== null) {
            ingredient = ing.ingredient || ing.name || '';
            measure = ing.measure || ing.quantity || '';
          } else if (typeof ing === 'string') {
            ingredient = ing;
          }
          
          if (ingredient && ingredient.trim()) {
            const displayText = measure ? `- ${ingredient} : ${measure}` : `- ${ingredient}`;
            html += `<div class="ingredient-item">${displayText}</div>`;
            count++;
          }
        });
        
        if (ingredients.length > count) {
          html += `<div class="ingredient-item">+${ingredients.length - count} more...</div>`;
        }
        html += '</div></div>';
      }
      
      // Instructions preview
      if (instructions) {
        const preview = instructions.substring(0, 200) + (instructions.length > 200 ? '...' : '');
        html += `<div class="recipe-description">📖 ${preview}</div>`;
      }
      
      // View details button
      html += '<button class="view-details-btn" onclick="showRecipeDetails(' + "'" + (recipe.external_id_meal || recipe.id) + "'" + ')">👁️ View Full Recipe</button>';
      
      html += '</div></div>';
      return html;
    }

    async function searchRecipes() {
      const query = queryInput.value.trim();
      if (!query) return;

      addMessage(query, 'user');
      queryInput.value = '';
      queryInput.style.height = 'auto';
      sendBtn.disabled = true;
      showTyping();

      try {
        console.log('Sending query:', query);
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: query })
        });

        console.log('Response status:', response.status);
        const data = await response.json();
        console.log('Response data:', data);
        hideTyping();
        
        if (data.error) {
          addMessage(`❌ Error: ${data.error}`, 'ai');
          return;
        }

        // Show LLM message
        if (data.message) {
          addMessage(data.message, 'ai');
        }

        // Show recipe results
        if (data.type === 'recipe_search') {
          if (data.data && data.data.length > 0) {
            storeRecipes(data.data);  // Store for modal access
            let recipesHtml = '';
            data.data.forEach(recipe => {
              recipesHtml += formatRecipe(recipe);
            });
            addMessage(recipesHtml, 'ai');
          } else {
            addMessage('No recipes found matching your query. Try different keywords!', 'ai');
          }
        } else if (data.type === 'no_results') {
          addMessage(data.message || 'No recipes found. Try different keywords!', 'ai');
        }
      } catch (error) {
        hideTyping();
        console.error('Error:', error);
        addMessage(`❌ Connection error: ${error.message}`, 'ai');
      } finally {
        sendBtn.disabled = false;
        queryInput.focus();
      }
    }

    async function loadRecipesByCategory(category) {
      // Use RAG search instead of direct endpoint
      clearEmptyState();
      const query = `${category} recipes`;
      addMessage(query, 'user');
      showTyping();

      try {
        console.log('Category chip clicked, using RAG for:', query);
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: query })
        });

        const data = await response.json();
        console.log('RAG response:', data);
        hideTyping();
        
        if (data.error) {
          addMessage(`❌ Error: ${data.error}`, 'ai');
          return;
        }

        // Show message
        if (data.message) {
          addMessage(data.message, 'ai');
        }

        // Show recipe results
        if (data.type === 'recipe_search' && data.data && data.data.length > 0) {
          storeRecipes(data.data);  // Store for modal access
          let recipesHtml = '';
          data.data.forEach(recipe => {
            recipesHtml += formatRecipe(recipe);
          });
          addMessage(recipesHtml, 'ai');
        } else {
          addMessage(`No ${category} recipes found.`, 'ai');
        }
      } catch (error) {
        hideTyping();
        console.error('Error:', error);
        addMessage(`❌ Error loading recipes: ${error.message}`, 'ai');
      }
    }

    // Store recipes globally for modal access
    let allRecipes = [];

    // Update allRecipes when displaying search results
    function storeRecipes(recipes) {
      allRecipes = recipes;
    }

    function showRecipeDetails(recipeId) {
      console.log('Opening recipe details for:', recipeId);
      const recipe = allRecipes.find(r => (r.external_id_meal || r.id) == recipeId);
      if (!recipe) {
        console.error('Recipe not found:', recipeId);
        return;
      }
      
      const modal = document.getElementById('recipe-modal');
      const content = document.getElementById('modal-recipe-content');
      
      let html = `<h2 class="modal-recipe-title">${recipe.name_meal || recipe.name}</h2>`;
      html += '<div class="recipe-meta">';
      if (recipe.category || recipe.category_name) html += `<span>🍽️ ${recipe.category || recipe.category_name}</span>`;
      if (recipe.country || recipe.area) html += `<span>🌍 ${recipe.country || recipe.area}</span>`;
      if (recipe.similarity) html += `<span class="recipe-similarity">${(recipe.similarity * 100).toFixed(0)}% match</span>`;
      html += '</div>';
      
      // Instructions first
      if (recipe.instructions) {
        html += `<div class="modal-section"><div class="modal-section-title">INSTRUCTIONS</div><div class="modal-instructions">${recipe.instructions}</div></div>`;
        html += '<hr style="border: none; border-top: 2px solid var(--border); margin: 30px 0;">';
      }
      
      // Then ingredients
      const ingredients = recipe.ingredients || [];
      if (ingredients.length > 0) {
        html += '<div class="modal-section"><div class="modal-section-title">Ingredients</div><div class="modal-ingredients-list">';
        ingredients.forEach(ing => {
          const ingredient = (typeof ing === 'object' && ing !== null) ? (ing.ingredient || ing.name || '') : ing;
          const measure = (typeof ing === 'object' && ing !== null) ? (ing.measure || ing.quantity || '') : '';
          if (ingredient && ingredient.trim()) {
            html += `<div class="modal-ingredient">- ${ingredient}${measure ? ' : ' + measure : ''}</div>`;
          }
        });
        html += '</div></div>';
      }
      
      if (recipe.video_recipe || recipe.youtube_url) {
        html += `<div class="modal-section"><a href="${recipe.video_recipe || recipe.youtube_url}" target="_blank" style="color: var(--accent);">🎥 Watch Video</a></div>`;
      }
      
      content.innerHTML = html;
      modal.classList.add('active');
    }

    function closeRecipeModal() {
      document.getElementById('recipe-modal').classList.remove('active');
    }

    document.getElementById('recipe-modal').addEventListener('click', (e) => {
      if (e.target.id === 'recipe-modal') closeRecipeModal();
    });

    // Initialize
    loadCategories();
    queryInput.focus();
  </script>
</body>
</html>
